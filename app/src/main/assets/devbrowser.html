<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DevBrowser</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #0f1117;
  --surface:  #1a1d27;
  --surface2: #222639;
  --border:   #2e3347;
  --accent:   #4f9eff;
  --accent2:  #7c5cfc;
  --text:     #d4d8f0;
  --text2:    #6b7494;
  --err:      #f4717a;
  --warn:     #e8a838;
  --info:     #4fcfff;
  --ok:       #4ec9b0;
  --mono:     'Courier New', monospace;
  --tap:      44px;
  --r:        8px;
  --fs:       14px;
  --fs-sm:    12px;
  --fs-xs:    11px;
}

html {
  font-size: var(--fs);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden;
  height: 100dvh;
  width: 100vw;
  display: flex;
  flex-direction: column;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  width: 100%;
  overflow: hidden;
}

/* ── TOOLBAR ── */
#toolbar {
  flex-shrink: 0;
  height: var(--tap);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 6px;
  padding-left:  max(6px, env(safe-area-inset-left));
  padding-right: max(6px, env(safe-area-inset-right));
}

.nav-btn {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  background: none;
  border: none;
  border-radius: var(--r);
  color: var(--text2);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: background .1s, color .1s;
}
.nav-btn:active   { background: var(--surface2); color: var(--text); }
.nav-btn:disabled { opacity: .28; pointer-events: none; }

#url-bar {
  flex: 1;
  min-width: 0;
  height: 32px;
  display: flex;
  align-items: center;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 0 10px;
  gap: 5px;
  transition: border-color .15s;
}
#url-bar:focus-within { border-color: var(--accent); }

#secure-icon { font-size: 13px; flex-shrink: 0; line-height: 1; }

#url-input {
  flex: 1;
  min-width: 0;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-size: var(--fs-sm);
  font-family: var(--mono);
  caret-color: var(--accent);
  padding: 0;
}
#url-input::placeholder { color: var(--text2); }

#go-btn {
  flex-shrink: 0;
  background: none;
  border: none;
  color: var(--text2);
  font-size: 14px;
  cursor: pointer;
  padding: 2px;
  line-height: 1;
  -webkit-tap-highlight-color: transparent;
}
#go-btn:active { color: var(--accent); }

#dt-toggle-btn {
  flex-shrink: 0;
  height: 32px;
  padding: 0 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--accent);
  font-size: var(--fs-xs);
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  gap: 4px;
}
#dt-toggle-btn:active { background: #2a3050; }

/* ── LOADING BAR ── */
#loading-bar {
  flex-shrink: 0;
  height: 2px;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  opacity: 0;
}
#loading-bar.running {
  opacity: 1;
  animation: loadpulse 1.8s ease-in-out infinite;
}
@keyframes loadpulse {
  0%   { width: 5%;   opacity: 1; }
  70%  { width: 90%;  opacity: 1; }
  100% { width: 100%; opacity: 0; }
}

/* ── CONTENT ── */
#content-area {
  flex: 1;
  min-height: 0;
  position: relative;
  background: #fff;
  overflow: hidden;
}

#browser-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  background: #fff;
}

#error-overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: var(--bg);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 24px;
  text-align: center;
  z-index: 5;
}
#error-overlay.show { display: flex; }
#error-icon { font-size: 48px; opacity: .3; }
#error-msg  { color: var(--text2); font-size: var(--fs-sm); line-height: 1.7; }
#error-url  { color: var(--err); font-size: var(--fs-xs); font-family: var(--mono); word-break: break-all; }

/* ── DEVTOOLS ── */
#devtools {
  flex-shrink: 0;
  height: 45vh;
  min-height: 120px;
  max-height: 70vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-top: 1px solid var(--border);
  overflow: hidden;
}
#devtools.hidden { display: none; }

#dt-resize {
  flex-shrink: 0;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: ns-resize;
  -webkit-tap-highlight-color: transparent;
}
#dt-resize::before {
  content: '';
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
}
#dt-resize:active::before { background: var(--accent); }

#dt-tabs {
  flex-shrink: 0;
  display: flex;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
#dt-tabs::-webkit-scrollbar { display: none; }

.dt-tab {
  flex-shrink: 0;
  height: 38px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--text2);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.dt-tab:active { color: var(--text); }
.dt-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

#dt-close {
  flex-shrink: 0;
  margin-left: auto;
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text2);
  font-size: 16px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#dt-close:active { color: var(--err); }

#dt-content {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
}
.dt-panel {
  display: none;
  flex-direction: column;
  position: absolute;
  inset: 0;
}
.dt-panel.active { display: flex; }

/* ── CONSOLE ── */
#console-out {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  font-family: var(--mono);
  font-size: var(--fs-sm);
}
#console-out::-webkit-scrollbar { width: 3px; }
#console-out::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.ce {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 3px 10px;
  border-bottom: 1px solid transparent;
  line-height: 1.55;
}
.ce.log   { color: var(--text); }
.ce.info  { color: var(--info);  background: rgba(79,207,255,.04); border-color: rgba(79,207,255,.1); }
.ce.warn  { color: var(--warn);  background: rgba(232,168,56,.04); border-color: rgba(232,168,56,.15); }
.ce.error { color: var(--err);   background: rgba(244,113,122,.04); border-color: rgba(244,113,122,.15); }
.ce.ret   { color: var(--info); }
.ce.cmd   { color: #9cdcfe; }
.ci { opacity:.5; flex-shrink:0; font-size:10px; margin-top:2px; min-width:10px; }
.ct { flex:1; word-break:break-all; white-space:pre-wrap; }

#console-in-area {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  border-top: 1px solid var(--border);
  padding: 0 10px;
  background: var(--bg);
  height: 44px;
}
#console-prompt { color: var(--accent); font-family: var(--mono); font-size: 15px; }
#console-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: #9cdcfe;
  font-family: var(--mono);
  font-size: var(--fs-sm);
  caret-color: var(--accent);
  height: 100%;
  padding: 0;
}
#console-clear {
  background: none;
  border: none;
  color: var(--text2);
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  -webkit-tap-highlight-color: transparent;
}
#console-clear:active { color: var(--err); }

/* ── ELEMENTS ── */
#elem-bar {
  flex-shrink: 0;
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
  font-size: var(--fs-xs);
  color: var(--info);
  background: var(--bg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#elem-panel {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px;
  font-family: var(--mono);
  font-size: var(--fs-xs);
}
#elem-panel::-webkit-scrollbar { width: 3px; }
#elem-panel::-webkit-scrollbar-thumb { background: var(--border); }
.en { padding: 2px 4px 2px 16px; cursor:pointer; position:relative; line-height:1.7; border-radius:3px; -webkit-tap-highlight-color:transparent; }
.en:active { background: rgba(255,255,255,.04); }
.en.selected { background: rgba(79,158,255,.15); }
.e-tag { color:#4ec9b0; } .e-an { color:#9cdcfe; } .e-av { color:#ce9178; } .e-txt { color:var(--text2); }
.e-tog { position:absolute; left:2px; top:50%; transform:translateY(-50%); color:var(--text2); font-size:9px; }

/* ── NETWORK ── */
#net-toolbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  overflow-x: auto;
  scrollbar-width: none;
}
#net-toolbar::-webkit-scrollbar { display: none; }
.net-filter { flex-shrink:0; height:26px; padding:0 8px; font-size:var(--fs-xs); color:var(--text2); cursor:pointer; border-radius:4px; border:1px solid transparent; display:flex; align-items:center; -webkit-tap-highlight-color:transparent; }
.net-filter.active { background:var(--accent); color:#fff; }
.net-filter:active:not(.active) { background:var(--surface2); }
#net-clear { margin-left:auto; flex-shrink:0; height:26px; padding:0 10px; background:none; border:1px solid var(--border); border-radius:4px; color:var(--text2); font-size:var(--fs-xs); cursor:pointer; -webkit-tap-highlight-color:transparent; }
#net-clear:active { border-color:var(--text); color:var(--text); }
#net-list { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
#net-list::-webkit-scrollbar { width:3px; }
#net-list::-webkit-scrollbar-thumb { background:var(--border); }
.nh { display:grid; grid-template-columns:1fr 46px 42px 50px; padding:4px 10px; font-size:10px; color:var(--text2); border-bottom:1px solid var(--border); background:var(--surface2); position:sticky; top:0; z-index:1; }
.nr { display:grid; grid-template-columns:1fr 46px 42px 50px; padding:5px 10px; font-size:var(--fs-xs); font-family:var(--mono); border-bottom:1px solid rgba(46,51,71,.5); cursor:pointer; -webkit-tap-highlight-color:transparent; align-items:center; }
.nr:active { background:var(--surface2); }
.nr .nu { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.s-ok{color:var(--ok);} .s-err{color:var(--err);} .s-pend{color:var(--warn);} .s-redir{color:var(--info);}

/* ── APPLICATION ── */
#app-panel { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px; }
#app-panel::-webkit-scrollbar { width:3px; }
#app-panel::-webkit-scrollbar-thumb { background:var(--border); }
.st-sec { margin-bottom:18px; }
.st-title { font-size:10px; color:var(--text2); text-transform:uppercase; letter-spacing:.8px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.st-refresh { background:none; border:none; color:var(--text2); cursor:pointer; font-size:14px; padding:2px; -webkit-tap-highlight-color:transparent; }
.st-refresh:active { color:var(--accent); }
.st-tbl { width:100%; border-collapse:collapse; font-family:var(--mono); font-size:var(--fs-xs); }
.st-tbl th { text-align:left; color:var(--text2); padding:4px 8px; border-bottom:1px solid var(--border); font-weight:normal; }
.st-tbl td { padding:4px 8px; border-bottom:1px solid rgba(46,51,71,.4); overflow:hidden; max-width:140px; text-overflow:ellipsis; white-space:nowrap; }
.st-tbl tr:active td { background:var(--surface2); }
.st-empty { color:var(--text2); font-size:var(--fs-xs); padding:6px 4px; }

/* ── PERFORMANCE ── */
#perf-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px; flex-shrink:0; }
.perf-card { background:var(--surface2); border:1px solid var(--border); border-radius:var(--r); padding:10px 12px; }
.perf-label { font-size:10px; color:var(--text2); margin-bottom:4px; }
.perf-val   { font-size:17px; font-weight:700; color:var(--accent); }
#perf-resources { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 10px 10px; font-size:var(--fs-xs); }
.res-row  { display:flex; align-items:center; gap:6px; padding:3px 0; font-family:var(--mono); }
.res-name { width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text2); }
.res-bar-wrap { flex:1; background:var(--border); border-radius:2px; height:3px; }
.res-bar  { height:3px; border-radius:2px; background:var(--accent); }
.res-time { color:var(--info); min-width:44px; text-align:right; }

/* ── SOURCES ── */
#src-panel { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px; font-family:var(--mono); font-size:var(--fs-xs); color:var(--text2); }
.src-file { padding:5px 8px; cursor:pointer; border-radius:4px; display:flex; align-items:center; gap:8px; -webkit-tap-highlight-color:transparent; }
.src-file:active { background:var(--surface2); }
.src-icon { font-size:14px; flex-shrink:0; }
</style>
</head>
<body>
<div id="app">

  <div id="toolbar">
    <button class="nav-btn" id="btn-back" disabled>&#8592;</button>
    <button class="nav-btn" id="btn-fwd"  disabled>&#8594;</button>
    <button class="nav-btn" id="btn-ref">&#8635;</button>
    <div id="url-bar">
      <span id="secure-icon">🌐</span>
      <input id="url-input" type="url" placeholder="URL atau cari..."
        autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"/>
      <button id="go-btn">&#9654;</button>
    </div>
    <button id="dt-toggle-btn">&#128202; Dev</button>
  </div>

  <div id="loading-bar"></div>

  <div id="content-area">
    <iframe id="browser-frame"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"
      title="Browser Content"></iframe>
    <div id="error-overlay">
      <div id="error-icon">&#128683;</div>
      <strong style="color:var(--text)">Tidak Dapat Dimuat</strong>
      <div id="error-msg">Situs ini memblokir iframe (X-Frame-Options).<br>Coba situs lain atau data: URL.</div>
      <div id="error-url"></div>
    </div>
  </div>

  <div id="devtools" class="hidden">
    <div id="dt-resize"></div>
    <div id="dt-tabs">
      <div class="dt-tab active" data-tab="console">Console</div>
      <div class="dt-tab" data-tab="elements">Elements</div>
      <div class="dt-tab" data-tab="network">Network</div>
      <div class="dt-tab" data-tab="application">Storage</div>
      <div class="dt-tab" data-tab="performance">Perf</div>
      <div class="dt-tab" data-tab="sources">Sources</div>
      <div id="dt-close">&#10005;</div>
    </div>
    <div id="dt-content">

      <div class="dt-panel active" id="panel-console">
        <div id="console-out"></div>
        <div id="console-in-area">
          <span id="console-prompt">&gt;</span>
          <input id="console-input" type="text" placeholder="Ketik JavaScript..."
            autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"/>
          <button id="console-clear">&#128465;</button>
        </div>
      </div>

      <div class="dt-panel" id="panel-elements">
        <div id="elem-bar">Buka tab Elements untuk inspect DOM</div>
        <div id="elem-panel"></div>
      </div>

      <div class="dt-panel" id="panel-network">
        <div id="net-toolbar">
          <span class="net-filter active" data-filter="all">All</span>
          <span class="net-filter" data-filter="Fetch">Fetch</span>
          <span class="net-filter" data-filter="Doc">Doc</span>
          <span class="net-filter" data-filter="JS">JS</span>
          <span class="net-filter" data-filter="CSS">CSS</span>
          <button id="net-clear">Clear</button>
        </div>
        <div id="net-list">
          <div class="nh"><span>Name</span><span>Status</span><span>Type</span><span>Time</span></div>
        </div>
      </div>

      <div class="dt-panel" id="panel-application">
        <div id="app-panel">
          <div class="st-sec">
            <div class="st-title">&#128230; localStorage <button class="st-refresh" onclick="refreshStorage()">&#8635;</button></div>
            <div id="ls-content"></div>
          </div>
          <div class="st-sec">
            <div class="st-title">&#9201; sessionStorage</div>
            <div id="ss-content"></div>
          </div>
          <div class="st-sec">
            <div class="st-title">&#127850; Cookies</div>
            <div id="cookies-content"></div>
          </div>
        </div>
      </div>

      <div class="dt-panel" id="panel-performance">
        <div id="perf-grid"></div>
        <div id="perf-resources"></div>
      </div>

      <div class="dt-panel" id="panel-sources">
        <div id="src-panel"></div>
      </div>

    </div>
  </div>

</div>
<script>
const S={hist:[],hIdx:-1,url:'',loading:false,dtOpen:false,tab:'console',netReqs:[],netFilter:'all',cmdHist:[],cmdIdx:-1};
const $=id=>document.getElementById(id);
const frame=$('browser-frame'),urlInput=$('url-input'),loadBar=$('loading-bar');
const btnBack=$('btn-back'),btnFwd=$('btn-fwd'),btnRef=$('btn-ref');
const devtools=$('devtools'),conOut=$('console-out'),conIn=$('console-input');
const netList=$('net-list'),elemPnl=$('elem-panel'),elemBar=$('elem-bar');
const errOver=$('error-overlay'),errUrl=$('error-url');

// Console intercept
['log','warn','error','info','debug'].forEach(m=>{
  const o=console[m].bind(console);
  console[m]=(...a)=>{o(...a);addLog(m==='debug'?'log':m,a);};
});
console.clear=()=>conOut.innerHTML='';
window.onerror=(msg,src,ln)=>addLog('error',[`${msg} (${src}:${ln})`]);
window.addEventListener('unhandledrejection',e=>addLog('error',[`Promise: ${e.reason}`]));

// Network intercept
const _fetch=window.fetch;
window.fetch=async(...args)=>{
  const url=typeof args[0]==='string'?args[0]:(args[0]?.url||'?');
  const r=mkReq(url,args[1]?.method||'GET','Fetch');
  try{const res=await _fetch(...args);const ct=res.headers.get('content-type')||'';
    r.type=ct.includes('json')?'JSON':ct.includes('html')?'Doc':'Fetch';
    finReq(r,res.status,res.ok?'ok':'err');return res;
  }catch(e){finReq(r,'ERR','err');throw e;}
};
const _XHR=window.XMLHttpRequest;
function PatchedXHR(){const x=new _XHR();let r;const _o=x.open.bind(x);
  x.open=(m,u,...rest)=>{r=mkReq(u,m,'XHR');return _o(m,u,...rest);};
  x.addEventListener('loadend',()=>{if(r)finReq(r,x.status||'ERR',x.status>=200&&x.status<400?'ok':'err');});
  return x;}
PatchedXHR.prototype=_XHR.prototype;window.XMLHttpRequest=PatchedXHR;

function mkReq(url,method,type){const r={id:Date.now()+Math.random(),url,method,type,status:'···',cls:'pend',time:'···',t0:Date.now()};S.netReqs.push(r);renderNetRow(r);return r;}
function finReq(r,status,cls){r.status=status;r.cls=cls;r.time=(Date.now()-r.t0)+'ms';
  const row=netList.querySelector(`[data-rid="${r.id}"]`);
  if(row){row.querySelector('.rs').textContent=status;row.querySelector('.rs').className='rs s-'+cls;row.querySelector('.rt').textContent=r.time;}}
function renderNetRow(r){
  if(S.netFilter!=='all'&&r.type!==S.netFilter)return;
  const d=document.createElement('div');d.className='nr';d.dataset.rid=r.id;d.dataset.type=r.type;
  const name=r.url.replace(/^https?:\/\//,'').split('?')[0].slice(0,34);
  d.innerHTML=`<span class="nu" title="${esc(r.url)}">${esc(name)}</span><span class="rs s-pend">${r.status}</span><span>${r.type}</span><span class="rt">${r.time}</span>`;
  d.addEventListener('click',()=>{addLog('info',[`[Net] ${r.method} ${r.url} → ${r.status} (${r.time})`]);openTab('console');});
  netList.appendC
